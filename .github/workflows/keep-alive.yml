name: Keep VIGIL Backend Warm

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sf https://vigil-backend.onrender.com/healthz || echo "Backend asleep, this call wakes it"
